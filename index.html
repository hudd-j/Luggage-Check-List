<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>執行李清單 | Luggage Check List</title>
    <!-- Airplane Favicon / Browser Tab Icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✈️%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✈️%3C/text%3E%3C/svg%3E">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti for Celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .custom-checkbox:checked + div {
            background-color: #0284c7;
            border-color: #0284c7;
        }
        .custom-checkbox:checked + div i {
            display: block;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 pb-16">

    <!-- Navigation Header -->
    <header class="bg-gradient-to-r from-sky-600 via-blue-600 to-indigo-700 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center space-x-3 text-center sm:text-left">
                <div class="bg-white/20 p-2.5 rounded-2xl backdrop-blur-sm text-2xl shadow-inner">
                    ✈️
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black tracking-wide" id="appHeaderTitle">執行李清單</h1>
                    <p class="text-sky-100 text-xs mt-0.5" id="appHeaderSub">專為 Switch 玩家、充電器材、手信 & 四季不同氣候設計</p>
                </div>
            </div>

            <!-- Action Buttons on Header -->
            <div class="flex items-center space-x-2">
                <button onclick="toggleLanguage()" class="bg-white/15 hover:bg-white/25 text-white text-xs font-semibold px-3 py-2 rounded-xl backdrop-blur-sm transition border border-white/20 flex items-center gap-1.5">
                    <i class="fa-solid fa-globe"></i>
                    <span id="langBtnText">EN / 中文</span>
                </button>
                <button onclick="openDefaultPresetModal()" class="bg-white/15 hover:bg-white/25 text-white text-xs font-semibold px-3 py-2 rounded-xl backdrop-blur-sm transition border border-white/20 flex items-center gap-1.5">
                    <i class="fa-solid fa-sliders"></i>
                    <span id="presetBtnText">預設範本</span>
                </button>
                <button onclick="exportPackingList()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition shadow-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-copy"></i>
                    <span id="exportBtnText">複製清單</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 pt-6 space-y-8">

        <!-- Trip Duration Selector Card -->
        <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h2 class="text-base font-bold text-slate-800 flex items-center gap-2" id="durationTitle">
                        <i class="fa-solid fa-calendar-days text-sky-600"></i> 行程天數 (自動計算建議衣物與藥物數量)
                    </h2>
                    <p class="text-slate-500 text-xs mt-1" id="durationSub">選擇或自訂天數，系統會自動按比例調整建議帶備之數量</p>
                </div>
                
                <div class="flex flex-wrap items-center gap-2">
                    <div class="inline-flex rounded-xl bg-slate-100 p-1 border border-slate-200/80">
                        <button onclick="changeTripDays(3)" id="btnDays3" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition text-slate-600 hover:bg-white">
                            <span class="text-base font-extrabold mr-0.5">3</span><span class="text-[10px] text-slate-500 font-normal duration-unit">日</span>
                        </button>
                        <button onclick="changeTripDays(5)" id="btnDays5" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition text-slate-600 hover:bg-white">
                            <span class="text-base font-extrabold mr-0.5">5</span><span class="text-[10px] text-slate-500 font-normal duration-unit">日</span>
                        </button>
                        <button onclick="changeTripDays(7)" id="btnDays7" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-sky-600 text-white shadow-sm">
                            <span class="text-base font-extrabold mr-0.5">7</span><span class="text-[10px] opacity-90 font-normal duration-unit">日</span>
                        </button>
                        <button onclick="changeTripDays(10)" id="btnDays10" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition text-slate-600 hover:bg-white">
                            <span class="text-base font-extrabold mr-0.5">10</span><span class="text-[10px] text-slate-500 font-normal duration-unit">日</span>
                        </button>
                        <button onclick="changeTripDays(14)" id="btnDays14" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition text-slate-600 hover:bg-white">
                            <span class="text-base font-extrabold mr-0.5">14</span><span class="text-[10px] text-slate-500 font-normal duration-unit">日</span>
                        </button>
                    </div>

                    <!-- Custom Days Counter -->
                    <div class="flex items-center bg-slate-100 rounded-xl px-2 py-1 border border-slate-200">
                        <button onclick="adjustDays(-1)" class="w-7 h-7 flex items-center justify-center rounded-lg bg-white shadow-xs text-slate-700 hover:bg-slate-200 font-bold active:scale-95 transition">
                            -
                        </button>
                        <span class="px-3 text-center min-w-[3.5rem]">
                            <span id="currentTripDaysNum" class="text-lg font-black text-sky-600">7</span>
                            <span id="currentTripDaysUnit" class="text-xs font-medium text-slate-500 ml-0.5">日</span>
                        </span>
                        <button onclick="adjustDays(1)" class="w-7 h-7 flex items-center justify-center rounded-lg bg-white shadow-xs text-slate-700 hover:bg-slate-200 font-bold active:scale-95 transition">
                            +
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Destination Real-time Weather Query Card -->
        <section class="bg-gradient-to-br from-slate-900 via-sky-950 to-indigo-950 rounded-2xl p-6 text-white shadow-xl relative overflow-hidden border border-slate-800">
            <div class="absolute -right-10 -bottom-10 w-48 h-48 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-5">
                <div>
                    <h2 class="text-lg font-bold flex items-center gap-2 text-sky-300" id="weatherTitle">
                        <i class="fa-solid fa-cloud-sun-rain"></i> 目的地天氣預測
                    </h2>
                    <p class="text-slate-400 text-xs mt-1" id="weatherSub">搜尋你將會造訪嘅城市，即時調配裝備與季節配備</p>
                </div>

                <!-- City Search Bar -->
                <div class="flex items-center gap-2 w-full md:w-auto">
                    <div class="relative flex-1 md:w-64">
                        <i class="fa-solid fa-location-dot absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                        <input type="text" id="cityInput" placeholder="輸入城市 (例如：東京, 曼谷)" 
                               onkeydown="if(event.key==='Enter') searchCityWeather()"
                               class="w-full bg-slate-800/80 border border-slate-700/80 text-white placeholder-slate-400 text-sm rounded-xl pl-9 pr-4 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500 transition">
                    </div>
                    <button onclick="searchCityWeather()" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-sm px-4 py-2 rounded-xl transition shadow-md flex items-center gap-1.5 shrink-0">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <span id="searchBtnText">搜尋</span>
                    </button>
                </div>
            </div>

            <!-- Quick City Selector Chips -->
            <div class="flex items-center gap-2 overflow-x-auto pb-2 hide-scrollbar mb-4 text-xs">
                <span class="text-slate-400 shrink-0 font-medium" id="popularCitiesText">熱門城市:</span>
                <button onclick="quickSelectCity('Tokyo')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1 rounded-lg border border-slate-700 transition shrink-0">東京 Tokyo</button>
                <button onclick="quickSelectCity('Bangkok')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1 rounded-lg border border-slate-700 transition shrink-0">曼谷 Bangkok</button>
                <button onclick="quickSelectCity('Taipei')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1 rounded-lg border border-slate-700 transition shrink-0">台北 Taipei</button>
                <button onclick="quickSelectCity('Seoul')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1 rounded-lg border border-slate-700 transition shrink-0">首爾 Seoul</button>
                <button onclick="quickSelectCity('London')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1 rounded-lg border border-slate-700 transition shrink-0">倫敦 London</button>
                <button onclick="quickSelectCity('Paris')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1 rounded-lg border border-slate-700 transition shrink-0">巴黎 Paris</button>
            </div>

            <!-- Weather Output Container -->
            <div id="weatherDisplayContainer">
                <div class="bg-slate-800/40 rounded-xl p-8 text-center border border-slate-700/50">
                    <i class="fa-solid fa-compass-drafting text-4xl text-sky-400/50 mb-3 block"></i>
                    <p class="text-slate-300 text-sm" id="emptyWeatherMsg">請輸入城市或點擊上方熱門城市，查詢最新實時天氣與裝備建議。</p>
                </div>
            </div>
        </section>

        <!-- Season / Climate Mode Selector Row -->
        <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4">
                <div>
                    <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2" id="climateModeTitle">
                        <i class="fa-solid fa-sliders text-sky-600"></i> 裝備氣候模式
                    </h3>
                    <p class="text-xs text-slate-500 mt-0.5" id="climateModeSub">可隨時手動調整氣候組合，切換衣物與隨身裝備</p>
                </div>

                <div class="flex flex-wrap gap-1.5 bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs w-full sm:w-auto">
                    <button onclick="switchClimatePreset('all')" id="presetAll" class="px-3 py-1.5 rounded-lg font-semibold transition bg-sky-600 text-white shadow-xs">
                        🌐 <span id="presetAllText">全天候通用</span>
                    </button>
                    <button onclick="switchClimatePreset('hot')" id="presetHot" class="px-3 py-1.5 rounded-lg font-semibold transition text-slate-600 hover:bg-white">
                        ☀️ <span id="presetHotText">炎熱夏日</span>
                    </button>
                    <button onclick="switchClimatePreset('cold')" id="presetCold" class="px-3 py-1.5 rounded-lg font-semibold transition text-slate-600 hover:bg-white">
                        ❄️ <span id="presetColdText">寒冷雪國</span>
                    </button>
                    <button onclick="switchClimatePreset('mild')" id="presetMild" class="px-3 py-1.5 rounded-lg font-semibold transition text-slate-600 hover:bg-white">
                        🍂 <span id="presetMildText">春秋涼爽</span>
                    </button>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="mt-4 pt-3 border-t border-slate-100">
                <div class="flex items-center justify-between text-xs font-semibold mb-1.5">
                    <span class="text-slate-600" id="packingProgressText">行李準備進度</span>
                    <span id="packingProgressPercent" class="text-sky-600 font-extrabold text-sm">0% (0 / 0 已執好)</span>
                </div>
                <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden p-0.5 border border-slate-200">
                    <div id="progressBar" class="h-full bg-gradient-to-r from-sky-500 to-blue-600 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </section>

        <!-- Filter Tabs & Category Filter -->
        <div class="flex items-center justify-between flex-wrap gap-3">
            <div class="flex items-center gap-1.5 overflow-x-auto pb-1 hide-scrollbar w-full sm:w-auto" id="categoryTabs">
                <!-- Dynamically populated category buttons -->
            </div>

            <button onclick="confirmResetList()" class="text-xs font-semibold text-rose-500 hover:text-rose-600 hover:bg-rose-50 px-3 py-1.5 rounded-lg transition border border-rose-200/60 flex items-center gap-1 ml-auto">
                <i class="fa-solid fa-rotate-left"></i>
                <span id="resetBtnText">一鍵返回預設</span>
            </button>
        </div>

        <!-- Main Checklist Items Grid -->
        <div id="packingListContainer" class="space-y-4">
            <!-- Dynamically populated checklist categories -->
        </div>

        <!-- Add Custom Item Form -->
        <section class="bg-slate-100/80 rounded-2xl p-4 border border-slate-200/80">
            <h4 class="text-xs font-bold text-slate-700 mb-3 flex items-center gap-1.5" id="addCustomItemTitle">
                <i class="fa-solid fa-plus-circle text-sky-600"></i> 新增自訂物品
            </h4>
            <div class="flex flex-col sm:flex-row items-center gap-2">
                <select id="newItemCategory" class="w-full sm:w-44 bg-white border border-slate-300 text-xs rounded-xl px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500">
                    <!-- Categories populated dynamically -->
                </select>
                <input type="text" id="newItemName" placeholder="物品名稱 (例如：太陽眼鏡)" class="w-full bg-white border border-slate-300 text-xs rounded-xl px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500">
                <input type="text" id="newItemNote" placeholder="備註 (可不填)" class="w-full sm:w-48 bg-white border border-slate-300 text-xs rounded-xl px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500">
                <button onclick="addNewCustomItem()" class="w-full sm:w-auto bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition shadow-xs shrink-0 flex items-center justify-center gap-1">
                    <i class="fa-solid fa-plus"></i> <span id="addBtnText">加入</span>
                </button>
            </div>
        </section>

    </main>

    <!-- Modal: Default Preset Customizer -->
    <div id="presetModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-xl w-full max-h-[85vh] flex flex-col shadow-2xl border border-slate-200 overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2" id="presetModalTitle">
                    <i class="fa-solid fa-sliders text-sky-600"></i> 管理預設範本品項
                </h3>
                <button onclick="closeDefaultPresetModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="p-4 overflow-y-auto space-y-4 flex-1" id="presetModalList">
                <!-- Dynamically populated preset checkboxes -->
            </div>

            <div class="p-4 border-t border-slate-100 bg-slate-50 flex flex-wrap items-center justify-between gap-2">
                <button onclick="restoreFactoryDefaults()" class="text-xs text-rose-600 hover:underline font-medium" id="factoryResetBtnText">
                    還原原廠預設
                </button>
                <div class="flex items-center gap-2">
                    <button onclick="saveCurrentListAsDefaultPreset()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold px-3 py-2 rounded-xl transition" id="saveCurrentAsPresetText">
                        將目前清單設為預設
                    </button>
                    <button onclick="saveDefaultPresetModal()" class="bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold px-4 py-2 rounded-xl transition shadow-sm" id="savePresetBtnText">
                        儲存變更
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Reset Confirmation Modal -->
    <div id="resetConfirmModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl border border-slate-200 text-center space-y-4">
            <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <div>
                <h3 class="font-bold text-slate-800 text-base" id="resetConfirmTitle">確定重置行李清單？</h3>
                <p class="text-xs text-slate-500 mt-1" id="resetConfirmSub">這將會清空所有已勾選狀態，並還原至你設定的預設清單。</p>
            </div>
            <div class="flex items-center justify-center gap-3 pt-2">
                <button onclick="closeResetConfirmModal()" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold py-2.5 rounded-xl transition" id="cancelResetBtnText">
                    取消
                </button>
                <button onclick="executeResetList()" class="w-1/2 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold py-2.5 rounded-xl transition shadow-sm" id="confirmResetBtnText">
                    確定重置
                </button>
            </div>
        </div>
    </div>

    <!-- Custom Toast Message Container -->
    <div id="toastMessage" class="fixed bottom-5 right-5 bg-slate-900 text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-2xl z-50 hidden transform transition-all duration-300 flex items-center gap-2 border border-slate-700">
        <i class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
        <span id="toastText">訊息提示</span>
    </div>

    <script>
        let currentLang = localStorage.getItem('packing_lang') || 'zh';
        let tripDays = parseInt(localStorage.getItem('packing_days')) || 7;
        let activeClimate = localStorage.getItem('packing_climate') || 'all';
        let activeCategory = 'all';
        let weatherOffsetIndex = 7; // Weather navigation index

        function getWeatherIcon(code) {

            if (code <= 3) return 'fa-cloud-sun text-amber-300';
            if (code <= 48) return 'fa-smog text-slate-300';
            if (code <= 67) return 'fa-cloud-rain text-blue-400';
            if (code <= 77 || (code >= 85 && code <= 86)) return 'fa-snowflake text-sky-200';
            if (code <= 82) return 'fa-cloud-showers-heavy text-blue-400';
            if (code >= 95) return 'fa-cloud-bolt text-yellow-400';
            return 'fa-cloud text-slate-400';
        }

        async function fetchCityWeather(query) {
            const container = document.getElementById('weatherDisplayContainer');
            container.innerHTML = `
                <div class="bg-slate-800/40 rounded-xl p-8 text-center border border-slate-700/50">
                    <i class="fa-solid fa-spinner fa-spin text-3xl text-sky-400 mb-2"></i>
                    <p class="text-slate-300 text-xs font-medium">正在取得 ${query} 最新氣象資料...</p>
                </div>
            `;

            try {
                let lookupName = query;
                if (CITY_MAP[query]) lookupName = CITY_MAP[query].en;

                const geoRes = await fetch(`httpsgeocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(lookupName)}&count=5&language=en&format=json`.replace('httpsgeocoding', 'https://geocoding'));
                const geoData = await geoRes.json();

                if (!geoData.results || geoData.results.length === 0) {
                    throw new Error('City not found');
                }

                const city = geoData.results[0];
                const weatherRes = await fetch(`httpsapi.open-meteo.com/v1/forecast?latitude=${city.latitude}&longitude=${city.longitude}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&past_days=7&forecast_days=16`.replace('httpsapi', 'https://api'));
                const weatherData = await weatherRes.json();

                const now = new Date();
                const fetchedAt = `${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

                cachedWeather = {
                    cityName: city.name,
                    country: city.country || '',
                    daily: weatherData.daily,
                    fetchedAt: fetchedAt
                };

                localStorage.setItem('packing_cached_weather', JSON.stringify(cachedWeather));
                renderWeatherDisplay(cachedWeather);
            } catch (err) {
                container.innerHTML = `
                    <div class="bg-rose-950/40 rounded-xl p-6 text-center border border-rose-800/50 text-rose-300 text-xs">
                        <i class="fa-solid fa-circle-exclamation text-2xl mb-2 text-rose-400 block"></i>
                        未能找到該城市嘅天氣資料，請嘗試輸入英文名稱 (例如: Tokyo, London)。
                    </div>
                `;
            }
        }

        function shiftWeather(delta) {
            weatherOffsetIndex = Math.max(0, Math.min(16, weatherOffsetIndex + delta));
            if (cachedWeather) renderWeatherDisplay(cachedWeather);
        }

        function renderWeatherDisplay(data) {
            const container = document.getElementById('weatherDisplayContainer');
            const daily = data.daily;
            const lang = I18N[currentLang];

            const sliceStart = weatherOffsetIndex;
            const sliceEnd = weatherOffsetIndex + 7;
            const dates = daily.time.slice(sliceStart, sliceEnd);
            const codes = daily.weathercode.slice(sliceStart, sliceEnd);
            const maxTemps = daily.temperature_2m_max.slice(sliceStart, sliceEnd);
            const minTemps = daily.temperature_2m_min.slice(sliceStart, sliceEnd);
            const rainProbs = daily.precipitation_probability_max.slice(sliceStart, sliceEnd);

            let cardsHtml = '';
            let avgMax = 0;
            let hasHighRain = false;

            dates.forEach((dStr, idx) => {
                const dateObj = new Date(dStr);
                const dayName = dateObj.toLocaleDateString(currentLang === 'zh' ? 'zh-HK' : 'en-US', { weekday: 'short' });
                const monthDay = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
                
                const maxT = Math.round(maxTemps[idx]);
                const minT = Math.round(minTemps[idx]);
                const rain = rainProbs[idx] || 0;
                const iconClass = getWeatherIcon(codes[idx]);

                avgMax += maxT;
                if (rain > 40) hasHighRain = true;

                cardsHtml += `
                    <div class="bg-slate-800/80 rounded-xl p-3 border border-slate-700/80 text-center flex flex-col justify-between items-center hover:bg-slate-800 transition">
                        <span class="text-[11px] font-semibold text-sky-300">${monthDay} (${dayName})</span>
                        <div class="my-2 text-2xl">
                            <i class="fa-solid ${iconClass}"></i>
                        </div>
                        <div class="text-xs font-bold text-white mb-1">
                            ${maxT}° <span class="text-slate-400 font-normal text-[10px]">${minT}°</span>
                        </div>
                        <span class="text-[10px] ${rain > 30 ? 'text-sky-400 font-bold' : 'text-slate-400'} flex items-center gap-0.5">
                            <i class="fa-solid fa-umbrella text-[9px]"></i> ${rain}%
                        </span>
                    </div>
                `;
            });

            avgMax = Math.round(avgMax / dates.length);

            let tipMsg = "";
            if (avgMax >= 26) {
                tipMsg = currentLang === 'zh' 
                    ? `☀️ 當地平均約 ${avgMax}°C，氣候炎熱！已為你自動挑選涼爽衣物與防曬用品。` 
                    : `☀️ Avg ${avgMax}°C, warm weather! Scaled light clothing & sunscreen for you.`;
            } else if (avgMax <= 15) {
                tipMsg = currentLang === 'zh' 
                    ? `❄️ 當地平均約 ${avgMax}°C，氣候寒冷！建議切換「寒冷雪國」模式攜帶大衣保暖。` 
                    : `❄️ Avg ${avgMax}°C, chilly forecast! Consider switching to Cold climate mode for heavy coats.`;
            } else {
                tipMsg = currentLang === 'zh' 
                    ? `🍂 當地平均約 ${avgMax}°C，氣候宜人！建議帶備薄外套作早晚保暖。` 
                    : `🍂 Avg ${avgMax}°C, mild climate! Bring light jackets for morning and evening breeze.`;
            }

            if (hasHighRain) {
                tipMsg += currentLang === 'zh' ? " 🌧️ 預測有降雨機率，記得隨身帶備摺傘！" : " 🌧️ High chance of rain, pack a compact umbrella!";
            }

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between text-xs text-slate-300">
                        <span class="font-bold text-sky-300 flex items-center gap-1.5 text-sm">
                            <i class="fa-solid fa-location-dot"></i> ${data.cityName} ${data.country}
                        </span>
                        <span class="text-[11px] text-slate-400">${lang.dataFetchedAt} ${data.fetchedAt}</span>
                    </div>

                    <div class="relative flex items-center gap-2">
                        <button onclick="shiftWeather(-7)" ${weatherOffsetIndex <= 0 ? 'disabled class="opacity-30 cursor-not-allowed text-slate-400 p-1.5"' : 'class="bg-slate-800 hover:bg-slate-700 text-white p-2 rounded-xl transition border border-slate-700 shrink-0"'}>
                            <i class="fa-solid fa-chevron-left text-xs"></i>
                        </button>
                        <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-2 flex-1">
                            ${cardsHtml}
                        </div>
                        <button onclick="shiftWeather(7)" ${weatherOffsetIndex >= 14 ? 'disabled class="opacity-30 cursor-not-allowed text-slate-400 p-1.5"' : 'class="bg-slate-800 hover:bg-slate-700 text-white p-2 rounded-xl transition border border-slate-700 shrink-0"'}>
                            <i class="fa-solid fa-chevron-right text-xs"></i>
                        </button>
                    </div>

                    <div class="bg-sky-950/60 border border-sky-800/60 rounded-xl p-3 text-xs text-sky-200 flex items-center justify-between flex-wrap gap-2">
                        <p class="flex items-center gap-2">
                            <i class="fa-solid fa-lightbulb text-amber-300 text-base"></i>
                            <span>${tipMsg}</span>
                        </p>
                        <span class="text-[10px] text-slate-400 italic">${lang.sourceAttribution}</span>
                    </div>
                </div>
            `;
        }

        function renderCategoryTabs() {
            const container = document.getElementById('categoryTabs');
            const lang = I18N[currentLang];
            const categories = ['all', 'clothes', 'tech', 'personal_care', 'pharmacy', 'documents', 'misc'];

            let html = '';
            categories.forEach(cat => {
                const isActive = activeCategory === cat;
                const label = lang.cats[cat] || cat;
                html += `
                    <button onclick="setCategoryFilter('${cat}')" 
                        class="px-3 py-1.5 rounded-xl text-xs font-semibold shrink-0 transition ${
                            isActive ? 'bg-sky-600 text-white shadow-sm' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'
                        }">
                        ${label}
                    </button>
                `;
            });
            container.innerHTML = html;

            // Populate New Item Category Dropdown
            const select = document.getElementById('newItemCategory');
            select.innerHTML = '';
            Object.keys(lang.cats).filter(c => c !== 'all').forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = lang.cats[c];
                select.appendChild(opt);
            });
        }

        function setCategoryFilter(cat) {
            activeCategory = cat;
            renderCategoryTabs();
            renderPackingList();
        }

        function toggleItemPacked(itemId) {
            packedState[itemId] = !packedState[itemId];
            localStorage.setItem('packing_checked', JSON.stringify(packedState));
            renderPackingList();

            // Trigger Confetti when 100% complete
            const activeItems = getActiveItems();
            const checkedCount = activeItems.filter(i => packedState[i.id]).length;
            if (activeItems.length > 0 && checkedCount === activeItems.length) {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
        }

        function deleteItem(itemId) {
            // Check if custom item
            const customIdx = customItems.findIndex(ci => ci.id === itemId);
            if (customIdx > -1) {
                customItems.splice(customIdx, 1);
                localStorage.setItem('packing_custom_items', JSON.stringify(customItems));
            } else {
                if (!deletedItemIds.includes(itemId)) {
                    deletedItemIds.push(itemId);
                    localStorage.setItem('packing_deleted_ids', JSON.stringify(deletedItemIds));
                }
            }
            renderPackingList();
            showToast(currentLang === 'zh' ? '已刪除物品' : 'Item removed');
        }

        function renderPackingList() {
            const container = document.getElementById('packingListContainer');
            const lang = I18N[currentLang];
            const activeItems = getActiveItems();

            let itemsToDisplay = activeItems;
            if (activeCategory !== 'all') {
                itemsToDisplay = activeItems.filter(i => i.cat === activeCategory);
            }

            // Update Progress Bar
            const totalCount = activeItems.length;
            const checkedCount = activeItems.filter(i => packedState[i.id]).length;
            const pct = totalCount > 0 ? Math.round((checkedCount / totalCount) * 100) : 0;

            document.getElementById('packingProgressPercent').textContent = `${pct}% (${checkedCount} / ${totalCount} ${currentLang === 'zh' ? '已執好' : 'packed'})`;
            document.getElementById('progressBar').style.width = `${pct}%`;

            if (itemsToDisplay.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center border border-slate-200">
                        <i class="fa-solid fa-box-open text-3xl text-slate-300 mb-2 block"></i>
                        <p class="text-xs text-slate-500">${currentLang === 'zh' ? '此分類暫無物品，點擊下方表單新增品項！' : 'No items in this category. Add a custom item below!'}</p>
                    </div>
                `;
                return;
            }

            // Group by category
            const grouped = {};
            itemsToDisplay.forEach(item => {
                if (!grouped[item.cat]) grouped[item.cat] = [];
                grouped[item.cat].push(item);
            });

            let html = '';
            Object.keys(grouped).forEach(catKey => {
                const catTitle = lang.cats[catKey] || catKey;
                html += `
                    <div class="bg-white rounded-2xl p-4 md:p-5 shadow-xs border border-slate-200/90 space-y-3">
                        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-2 pb-2 border-b border-slate-100">
                            ${catTitle}
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                `;

                grouped[catKey].forEach(item => {
                    const isChecked = !!packedState[item.id];
                    const name = currentLang === 'zh' ? (item.nameZh || item.nameEn) : (item.nameEn || item.nameZh);
                    const note = currentLang === 'zh' ? (item.noteZh || item.noteEn) : (item.noteEn || item.noteZh);
                    const qtyInfo = getItemQuantityStr(item);

                    html += `
                        <div class="flex items-center justify-between p-3 rounded-xl border ${
                            isChecked ? 'bg-sky-50/50 border-sky-200/60' : 'bg-slate-50/60 border-slate-200/80 hover:bg-slate-100/60'
                        } transition group">
                            <label class="flex items-center gap-3 cursor-pointer flex-1 min-w-0 pr-2">
                                <div class="relative shrink-0">
                                    <input type="checkbox" onchange="toggleItemPacked('${item.id}')" ${isChecked ? 'checked' : ''} class="sr-only custom-checkbox">
                                    <div class="w-5 h-5 rounded-lg border-2 border-slate-300 flex items-center justify-center transition bg-white">
                                        <i class="fa-solid fa-check text-white text-[10px] hidden"></i>
                                    </div>
                                </div>
                                <div class="truncate">
                                    <div class="text-xs font-semibold ${isChecked ? 'line-through text-slate-400' : 'text-slate-800'} truncate">
                                        ${name}
                                    </div>
                                    ${note ? `<div class="text-[10px] text-slate-400 truncate mt-0.5">${note}</div>` : ''}
                                </div>
                            </label>

                            <div class="flex items-center gap-2 shrink-0">
                                <span class="bg-slate-200/70 text-slate-700 px-2.5 py-1 rounded-lg text-xs font-medium">
                                    <span class="text-sm font-extrabold text-sky-600">${qtyInfo.num}</span> <span class="text-[10px] text-slate-500">${qtyInfo.unit}</span>
                                </span>
                                <button onclick="deleteItem('${item.id}')" class="text-slate-300 hover:text-rose-500 p-1.5 transition rounded-lg hover:bg-rose-50">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function addNewCustomItem() {
            const nameInput = document.getElementById('newItemName');
            const noteInput = document.getElementById('newItemNote');
            const catSelect = document.getElementById('newItemCategory');

            const name = nameInput.value.trim();
            if (!name) return;

            const newItem = {
                id: 'custom_' + Date.now(),
                cat: catSelect.value,
                nameZh: name,
                nameEn: name,
                noteZh: noteInput.value.trim(),
                noteEn: noteInput.value.trim(),
                qtyBase: '1',
                unitZh: '件',
                unitEn: 'pcs'
            };

            customItems.push(newItem);
            localStorage.setItem('packing_custom_items', JSON.stringify(customItems));

            nameInput.value = '';
            noteInput.value = '';

            renderPackingList();
            showToast(currentLang === 'zh' ? '已成功加入自訂物品！' : 'Custom item added!');
        }

        // Preset Modal Functions
        function openDefaultPresetModal() {
            const container = document.getElementById('presetModalList');
            const activePresetIds = userDefaultPresets || MASTER_ITEMS.map(i => i.id);

            let html = '<div class="space-y-2">';
            MASTER_ITEMS.forEach(item => {
                const isSelected = activePresetIds.includes(item.id);
                const name = currentLang === 'zh' ? item.nameZh : item.nameEn;
                html += `
                    <label class="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-200 text-xs cursor-pointer hover:bg-slate-100 transition">
                        <span class="font-medium text-slate-700">${name}</span>
                        <input type="checkbox" value="${item.id}" ${isSelected ? 'checked' : ''} class="preset-checkbox w-4 h-4 text-sky-600 rounded">
                    </label>
                `;
            });
            html += '</div>';

            container.innerHTML = html;
            document.getElementById('presetModal').classList.remove('hidden');
        }

        function closeDefaultPresetModal() {
            document.getElementById('presetModal').classList.add('hidden');
        }

        function saveDefaultPresetModal() {
            const checkboxes = document.querySelectorAll('.preset-checkbox');
            const selected = [];
            checkboxes.forEach(cb => {
                if (cb.checked) selected.push(cb.value);
            });

            userDefaultPresets = selected;
            localStorage.setItem('packing_user_presets', JSON.stringify(userDefaultPresets));
            closeDefaultPresetModal();
            renderPackingList();
            showToast(currentLang === 'zh' ? '預設範本設定已更新！' : 'Preset settings updated!');
        }

        function restoreFactoryDefaults() {
            userDefaultPresets = null;
            deletedItemIds = [];
            localStorage.removeItem('packing_user_presets');
            localStorage.removeItem('packing_deleted_ids');
            closeDefaultPresetModal();
            renderPackingList();
            showToast(currentLang === 'zh' ? '已還原至原廠預設！' : 'Restored to factory defaults!');
        }

        function saveCurrentListAsDefaultPreset() {
            const activeIds = getActiveItems().map(i => i.id);
            userDefaultPresets = activeIds;
            localStorage.setItem('packing_user_presets', JSON.stringify(userDefaultPresets));
            closeDefaultPresetModal();
            showToast(currentLang === 'zh' ? '已將目前清單儲存為預設範本！' : 'Saved current list as default preset!');
        }

        // Reset Modal
        function confirmResetList() {
            document.getElementById('resetConfirmModal').classList.remove('hidden');
        }

        function closeResetConfirmModal() {
            document.getElementById('resetConfirmModal').classList.add('hidden');
        }

        function executeResetList() {
            packedState = {};
            localStorage.removeItem('packing_checked');
            closeResetConfirmModal();
            renderPackingList();
            showToast(currentLang === 'zh' ? '已重置行李清單！' : 'List reset to default state!');
        }

        function showToast(msg) {
            const toast = document.getElementById('toastMessage');
            document.getElementById('toastText').textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2500);
        }

        function exportPackingList() {
            const items = getActiveItems();
            const lang = I18N[currentLang];
            
            let text = `✈️ ${lang.appTitle} (${tripDays} ${lang.dayUnit})\n`;
            text += `------------------------------\n`;

            const grouped = {};
            items.forEach(item => {
                if (!grouped[item.cat]) grouped[item.cat] = [];
                grouped[item.cat].push(item);
            });

            Object.keys(grouped).forEach(catKey => {
                text += `\n[ ${lang.cats[catKey] || catKey} ]\n`;
                grouped[catKey].forEach(item => {
                    const isChecked = packedState[item.id] ? '[✓]' : '[ ]';
                    const name = currentLang === 'zh' ? (item.nameZh || item.nameEn) : (item.nameEn || item.nameZh);
                    const qtyInfo = getItemQuantityStr(item);
                    text += `${isChecked} ${name} x${qtyInfo.num}${qtyInfo.unit}\n`;
                });
            });

            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            showToast(currentLang === 'zh' ? '已複製清單至剪貼簿！' : 'List copied to clipboard!');
        }

        function renderApp() {
            updateStaticText();
            changeTripDays(tripDays);
            switchClimatePreset(activeClimate);
            renderCategoryTabs();
            renderPackingList();
        }

        window.onload = function() {
            renderApp();
            if (cachedWeather) {
                renderWeatherDisplay(cachedWeather);
            }
        };
    </script>
</body>
</html>
